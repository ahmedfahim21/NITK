name: OSM snapshot

# Fetches the OpenStreetMap extract for the campus and commits it to
# public/data/nitk-osm.json, so the game ships with the map instead of
# downloading it at start-up.
on:
  workflow_dispatch:
  push:
    paths:
      - src/area.json
      - src/osm/query.ts
      - scripts/fetch-osm.mjs
      - .github/workflows/osm-snapshot.yml

permissions:
  contents: write

concurrency:
  group: osm-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch extract
        run: node scripts/fetch-osm.mjs
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/nitk-osm.json
          if git diff --cached --quiet; then echo "snapshot unchanged"; exit 0; fi
          git commit -m "Update OpenStreetMap snapshot"
          git push
