<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>NITK World</title>
    <meta name="description" content="Walk the NITK Surathkal campus in 3D, built from OpenStreetMap." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500&family=Bebas+Neue&family=Noto+Sans:wght@400;500&family=Noto+Sans+Kannada:wght@700&family=Noto+Sans+Devanagari:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      /*
       * One HUD system: dark glass over the bright cel-shaded world, a single
       * gold accent, Barlow Condensed for labels and numbers, Bebas Neue for
       * the big moments, Noto Sans for reading. Hierarchy comes from size,
       * case and spacing rather than weight. Paper cards (journal, quizzes)
       * are the in-world documents.
       */
      :root {
        --ink: #11151d;
        --glass: rgba(15, 19, 28, 0.66);
        --glass-strong: rgba(15, 19, 28, 0.84);
        --line: rgba(255, 255, 255, 0.12);
        --line-strong: rgba(255, 255, 255, 0.22);
        --text: #f3eee4;
        --muted: #a7aebb;
        --gold: #f2b84b;
        --gold-deep: #c98a1f;
        --teal: #5cc6a9;
        --red: #ef6a57;
        --blue: #7fb2ff;
        --paper: #f6f1e6;
        --radius: 14px;
        --label: "Barlow Condensed", "Noto Sans", system-ui, sans-serif;
        --display: "Bebas Neue", "Barlow Condensed", system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0f17; font-family: "Noto Sans", system-ui, sans-serif; color: var(--text); }
      #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
      #view:active { cursor: grabbing; }

      .panel, .glass {
        background: var(--glass);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        backdrop-filter: blur(12px) saturate(1.2);
        -webkit-backdrop-filter: blur(12px) saturate(1.2);
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.06);
        color: var(--text);
      }
      .cap { font-family: var(--label); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
      kbd {
        display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; padding: 0 6px;
        border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 6px; background: rgba(255, 255, 255, 0.08);
        font: 500 12px var(--label); letter-spacing: 0.04em; color: var(--text);
      }

      /* Where you are */
      #title { position: fixed; top: 16px; left: 16px; padding: 10px 16px 11px; pointer-events: none; min-width: 220px; }
      #title h1 { margin: 0; font: 400 12px var(--label); letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); }
      #title h1 span { color: var(--muted); }
      #near { margin-top: 3px; font: 500 21px/1.15 var(--label); letter-spacing: 0.02em; color: var(--text); min-height: 1.15em; }
      #near.pulse { animation: rise 0.45s ease-out; }
      @keyframes rise { from { transform: translateY(5px); opacity: 0; } to { transform: none; opacity: 1; } }

      /* The clock: time, day, and the day's shape (classes, curfew) */
      #clock { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); padding: 10px 16px 10px 12px; pointer-events: none; min-width: 270px; display: grid; grid-template-columns: 64px 1fr; column-gap: 12px; align-items: center; }
      #clock .face { width: 64px; height: 64px; display: block; }
      #clock .digits { text-align: left; }
      #clock .strip { grid-column: 1 / -1; }
      #clock .time { font: 400 34px/1 var(--display); letter-spacing: 0.04em; font-variant-numeric: tabular-nums; }
      #clock .time span { font-size: 16px; margin-left: 4px; color: var(--muted); }
      #clock .day { font: 400 12px var(--label); letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin-top: 2px; }
      #clock .strip { position: relative; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.12); margin: 9px 2px 14px; }
      #clock .strip i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: linear-gradient(90deg, var(--gold-deep), var(--gold)); }
      #clock .strip b { position: absolute; top: -3px; width: 1px; height: 10px; background: var(--line-strong); }
      #clock .strip b::after { content: attr(data-l); position: absolute; top: 11px; left: 50%; transform: translateX(-50%); font: 400 10px var(--label); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
      #clock .strip b.now { background: var(--gold); }
      #clock .strip b.now::after { color: var(--gold); }
      #clock.curfew .time { color: var(--red); }

      /* Minimap */
      #minimap-wrap { position: fixed; top: 16px; right: 16px; width: 196px; height: 196px; border-radius: 50%; padding: 5px; cursor: pointer; }
      #minimap { width: 100%; height: 100%; border-radius: 50%; display: block; background: #9fc3cf; }
      #minimap-wrap::after { content: "M  MAP"; position: absolute; left: 50%; bottom: -10px; transform: translateX(-50%); padding: 2px 8px; border-radius: 999px; background: var(--glass-strong); border: 1px solid var(--line); font: 400 10px var(--label); letter-spacing: 0.16em; color: var(--muted); white-space: pre; }

      /* Help */
      #help { position: fixed; left: 16px; bottom: 16px; padding: 10px 14px; font-size: 12.5px; line-height: 2; max-width: 380px; color: var(--muted); }
      #help .keys { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
      #help .keys span { display: inline-flex; align-items: center; gap: 5px; }
      #help.hidden .more { display: none; }

      /* Controls */
      #controls { position: fixed; right: 16px; bottom: 16px; padding: 10px; display: flex; flex-direction: column; gap: 8px; align-items: stretch; font-size: 12px; min-width: 250px; }
      #controls .row { display: flex; gap: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
      #controls .row:empty { display: none; }
      #controls button, #controls select {
        flex: 1; font: 400 13px var(--label); letter-spacing: 0.08em; text-transform: uppercase; padding: 7px 8px; border: 0;
        border-right: 1px solid var(--line); background: rgba(255, 255, 255, 0.04); color: var(--text); cursor: pointer; transition: background 0.15s, color 0.15s;
      }
      #controls button:last-child, #controls select:last-child { border-right: 0; }
      #controls button:hover { background: rgba(255, 255, 255, 0.1); }
      #controls button.on { background: var(--gold); color: var(--ink); }
      #controls select { appearance: none; text-align: center; }
      #controls select option { color: var(--ink); }
      #mix { display: none; flex-direction: column; gap: 6px; padding: 4px 2px; }
      #mix.open { display: flex; }
      #mix label { display: grid; grid-template-columns: 74px 1fr; align-items: center; gap: 8px; font: 400 12px var(--label); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
      #mix input[type="range"] { accent-color: var(--gold); }
      #source { font-size: 11px; line-height: 1.4; color: var(--muted); padding: 0 2px; }
      #source a { color: var(--text); }
      #source .warn { color: var(--red); }
      body.exploring #stats, body.exploring #tracker { display: none !important; }

      /* Building labels, only when you're close */
      #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
      .label {
        position: absolute; left: 0; top: 0; padding: 4px 10px; white-space: nowrap; will-change: transform;
        font: 500 13px var(--label); letter-spacing: 0.06em; color: var(--text);
        background: var(--glass-strong); border: 1px solid var(--line); border-radius: 999px; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
      }

      /* Full map */
      #map-overlay { position: fixed; inset: 0; display: none; background: rgba(8, 11, 17, 0.72); backdrop-filter: blur(6px); padding: 24px; gap: 16px; z-index: 6; }
      #map-overlay.open { display: flex; }
      #big-map-wrap { flex: 1; position: relative; min-width: 0; border-radius: 18px; overflow: hidden; border: 1px solid var(--line-strong); box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45); }
      #big-map { width: 100%; height: 100%; display: block; cursor: grab; background: #12161c; touch-action: none; }
      #big-map:active { cursor: grabbing; }
      #map-tools { position: absolute; top: 12px; right: 12px; display: flex; flex-direction: column; gap: 6px; }
      .map-tool { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--glass-strong); color: var(--text); cursor: pointer; }
      .map-tool:hover { background: var(--gold); color: var(--ink); }
      .map-tool .pm { font: 400 22px/1 var(--label); }
      #map-tip { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); display: none; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: var(--glass-strong); border: 1px solid var(--line); font: 400 14px var(--label); letter-spacing: 0.04em; color: var(--text); pointer-events: none; }
      #map-credit { position: absolute; right: 12px; bottom: 8px; font-size: 10px; color: rgba(255, 255, 255, 0.55); pointer-events: none; }
      #map-side { width: 300px; display: flex; flex-direction: column; padding: 16px; gap: 8px; min-height: 0; }
      #map-side h2 { margin: 0 0 4px; font: 400 26px var(--display); letter-spacing: 0.06em; }
      #map-side .cap { margin-top: 4px; }
      #map-open { display: flex; flex-direction: column; gap: 1px; max-height: 30%; overflow: auto; margin: 0 -6px; }
      #map-open .cap { margin: 0 6px 2px; }
      #map-key { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 6px; margin: 0 -4px; }
      .key-item { display: flex; align-items: center; gap: 7px; padding: 4px; border: 0; border-radius: 8px; background: transparent; color: var(--text); font: 400 13px "Noto Sans", sans-serif; text-align: left; cursor: pointer; }
      .key-item:hover { background: rgba(255, 255, 255, 0.06); }
      .key-item .n { margin-left: auto; font: 400 12px var(--label); color: var(--muted); }
      .key-item.off { opacity: 0.38; }
      .dot { flex: none; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.5); }
      #place-search { font: 400 14px "Noto Sans", sans-serif; padding: 9px 12px; margin-top: 4px; border: 1px solid var(--line-strong); border-radius: 10px; background: rgba(255, 255, 255, 0.06); color: var(--text); outline: none; }
      #place-search:focus { border-color: var(--gold); }
      #place-list { flex: 1; min-height: 80px; overflow: auto; display: flex; flex-direction: column; gap: 1px; margin: 0 -6px; }
      #place-list .empty { padding: 8px 10px; color: var(--muted); font-size: 13px; }
      .place { display: flex; align-items: center; gap: 9px; text-align: left; font: 400 14px "Noto Sans", sans-serif; padding: 6px 10px; border: 0; background: transparent; color: var(--text); border-radius: 8px; cursor: pointer; }
      .place .ico { flex: none; display: grid; }
      .place .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .place:hover { background: rgba(242, 184, 75, 0.16); color: var(--gold); }
      #map-side .hint { font-size: 12px; color: var(--muted); }
      #map-close { font: 400 14px var(--label); letter-spacing: 0.12em; text-transform: uppercase; padding: 9px; border: 1px solid var(--line-strong); border-radius: 10px; background: rgba(255, 255, 255, 0.06); color: var(--text); cursor: pointer; }
      #map-close:hover { background: var(--gold); color: var(--ink); }
      .label .ico, #near .ico { display: inline-grid; vertical-align: -2px; margin-right: 6px; }

      /* Loading */
      #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; background: radial-gradient(ellipse at 50% 35%, #1f3354, #0b0f17 70%); color: var(--text); gap: 12px; z-index: 10; transition: opacity 0.6s; }
      #loading h1 { margin: 0; font: 400 64px/1 var(--display); letter-spacing: 0.08em; }
      #loading h1 span { color: var(--gold); }
      #loading p { margin: 0; font: 400 14px var(--label); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
      #loading.done { opacity: 0; pointer-events: none; }
      #fps { position: fixed; top: 222px; right: 24px; font: 400 11px var(--label); letter-spacing: 0.1em; color: rgba(255, 255, 255, 0.7); text-shadow: 0 1px 2px #000; pointer-events: none; }

      @media (max-width: 700px) {
        #minimap-wrap { width: 124px; height: 124px; top: 10px; right: 10px; }
        #title { top: 10px; left: 10px; max-width: calc(100vw - 150px); }
        #help { display: none; }
        #title { min-width: 0; padding: 8px 12px; }
        #near { font-size: 16px; }
        #clock { top: auto; bottom: 14px; min-width: 210px; grid-template-columns: 48px 1fr; }
        #clock .face { width: 48px; height: 48px; }
        #clock .time { font-size: 26px; }
        #controls { min-width: 0; width: 200px; right: 10px; bottom: 196px; padding: 6px; gap: 5px; }
        #controls button, #controls select { font-size: 11px; padding: 5px 4px; }
        #source { display: none; }
        #map-overlay { flex-direction: column; padding: 10px; }
        #map-side { width: auto; max-height: 40%; }
        #fps { top: 150px; }
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="labels"></div>
    <div id="title" class="panel">
      <h1>NITK <span>Surathkal</span></h1>
      <div id="near"></div>
    </div>
    <div id="clock" class="panel">
      <canvas class="face" width="128" height="128"></canvas>
      <div class="digits">
        <div class="time"></div>
        <div class="day"></div>
      </div>
      <div class="strip"></div>
    </div>
    <div id="minimap-wrap" class="panel" title="Open map (M)"><canvas id="minimap" width="380" height="380"></canvas></div>
    <div id="fps"></div>
    <div id="help" class="panel">
      <div class="keys">
        <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> walk</span>
        <span><kbd>Shift</kbd> run</span>
        <span><kbd>E</kbd> talk, interact</span>
      </div>
      <div class="more keys">
        <span><kbd>Space</kbd> jump</span>
        <span><kbd>B</kbd> bell</span>
        <span><kbd>J</kbd> journal</span>
        <span><kbd>Y</kbd> yearbook</span>
        <span><kbd>M</kbd> map</span>
        <span><kbd>F</kbd> drone</span>
        <span><kbd>T</kbd> skip time</span>
        <span><kbd>N</kbd> next track</span>
        <span><kbd>H</kbd> hide help</span>
      </div>
    </div>
    <div id="controls" class="panel">
      <div class="row" id="times"></div>
      <div class="row">
        <button id="btn-drone" title="F">Drone</button>
        <button id="btn-map" title="M">Map</button>
      </div>
      <div class="row" id="sound"></div>
      <div class="row" id="season-row" style="display: none"></div>
      <div id="mix"></div>
      <div id="source"></div>
    </div>
    <div id="map-overlay">
      <div id="big-map-wrap">
        <canvas id="big-map"></canvas>
        <div id="map-tools"></div>
        <div id="map-tip"></div>
        <span id="map-credit">© OpenStreetMap contributors</span>
      </div>
      <div id="map-side" class="panel">
        <div class="cap">Campus map</div>
        <h2>NITK Surathkal</h2>
        <div id="map-open"></div>
        <div class="cap">Key</div>
        <div id="map-key"></div>
        <input id="place-search" placeholder="Search places" autocomplete="off" />
        <div id="place-list"></div>
        <div class="hint">Drag to move, scroll to zoom. Click the map or a place to teleport.</div>
        <button id="map-close">Close · M</button>
      </div>
    </div>
    <div id="loading">
      <h1>NITK <span>WORLD</span></h1>
      <p id="loading-msg">Starting</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
